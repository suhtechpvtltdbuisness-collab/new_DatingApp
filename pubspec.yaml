name: dating_app
description: "Velora - a modern 18+ dating app. Find your perfect match."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
   flutter:
    sdk: flutter

   swipable_stack: ^2.0.0

   image_picker: ^1.0.7
   dotted_border: ^2.1.0

   geolocator: ^10.1.0
   permission_handler: ^11.3.0
   country_code_picker: ^3.0.0
   # UI & Design
   cupertino_icons: ^1.0.8
   google_fonts: ^6.1.0
   flutter_screenutil: ^5.9.0
   # State Management & Architecture
   get: ^4.6.6
   # HTTP & Networking
   dio: ^5.3.1
   # Local Storage
   shared_preferences: ^2.2.2
   # Image & Media
   cached_network_image: ^3.3.1
   flutter_svg: ^2.2.0
   # Date & Time
   intl: ^0.19.0
   # Logging
   logger: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.6
  floor_generator: ^1.4.2
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/

