name: Build Play Store release (AAB + APK)

# Runs the compile step this repo's own sandbox environment cannot do
# (no network access to Flutter/Android SDK download servers there).
# GitHub-hosted runners have full internet access, so this is the
# reliable place to produce the actual .aab / .apk you upload to Play
# Console.
#
# One-time setup before this workflow can sign a release build:
#   1. Base64-encode your upload keystore:
#        base64 -i android/keystore/datingapp-upload.jks | tr -d '\n' > keystore.b64
#   2. In GitHub → Settings → Secrets and variables → Actions, add:
#        ANDROID_KEYSTORE_BASE64   = contents of keystore.b64
#        ANDROID_KEYSTORE_PASSWORD = your keystore's storePassword
#        ANDROID_KEY_PASSWORD      = your keystore's keyPassword
#        ANDROID_KEY_ALIAS         = your keystore's keyAlias (e.g. "upload")
#   Never commit android/key.properties or the .jks file to the repo —
#   both are already in .gitignore. Rotate the keystore password baked
#   into the delivered source before you rely on this workflow, since it
#   ships in plaintext in key.properties for local/manual builds.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Decode upload keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          mkdir -p android/keystore
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/keystore/datingapp-upload.jks

      - name: Write key.properties
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          printf '%s\n' \
            "storePassword=$ANDROID_KEYSTORE_PASSWORD" \
            "keyPassword=$ANDROID_KEY_PASSWORD" \
            "keyAlias=$ANDROID_KEY_ALIAS" \
            "storeFile=keystore/datingapp-upload.jks" \
            > android/key.properties

      - name: Warn if release signing secrets are missing
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        run: |
          echo "::warning::ANDROID_KEYSTORE_BASE64 secret is empty. Release build will be signed with the debug key."

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build App Bundle (release)
        run: flutter build appbundle --release

      - name: Build APK (release, for manual/device testing)
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: build/app/outputs/bundle/release/app-release.aab

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
